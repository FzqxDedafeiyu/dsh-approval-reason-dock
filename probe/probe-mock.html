<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #14161a; color: #e8e8e8; font-family: system-ui, "Microsoft YaHei", sans-serif; }
  .window { width: 900px; height: 500px; box-sizing: border-box; position: relative; overflow: hidden; display: flex; }
  .sidebar { width: 220px; background: #101216; border-right: 1px solid #2a2d33; padding: 14px 10px; font-size: 13px; color: #9a9a9a; }
  .sidebar .item { padding: 7px 9px; border-radius: 7px; margin-bottom: 4px; }
  .sidebar .item.active { background: #23272e; color: #e8e8e8; }
  .main { flex: 1; padding: 18px 22px; font-size: 13px; line-height: 1.8; color: #b9b9b9; }
  .main .line { margin-bottom: 8px; }
  .main .strong { color: #e8e8e8; }
  .probe {
    position: absolute; right: 12px; top: 64px; z-index: 9999;
    padding: 6px 9px; border-radius: 8px; border: 1px solid #3a3a3a;
    background: rgba(20, 24, 30, 0.88); color: #e8e8e8;
    font-family: Consolas, ui-monospace, monospace; font-size: 11px; line-height: 1.45;
    max-width: 460px;
  }
  .probe .head { color: #e0a45e; font-weight: 600; }
  .probe .k { color: #8a8a8a; }
  .probe .v { color: #e8e8e8; }
  .callout { position: absolute; right: 12px; top: 210px; font-size: 12px; color: #e0a45e; }
</style>
</head>
<body>
  <div class="window">
    <div class="sidebar">
      <div class="item">会话列表</div>
      <div class="item active">改造审批中文与拒绝理由</div>
      <div class="item">简单测试请求</div>
      <div class="item">另一个会话…</div>
    </div>
    <div class="main">
      <div class="line"><span class="strong">你：</span>测试一下审批</div>
      <div class="line"><span class="strong">助手：</span>我需要写一个工作区外的文件，申请升级权限。</div>
      <div class="line" style="color:#6f7680">（审批卡出现在输入区，内置卡负责允许/拒绝）</div>
    </div>
    <div class="probe">
      <div class="head">approval-probe</div>
      <div><span class="k">current: </span><span class="v">193a43cf …</span></div>
      <div><span class="k">raw: </span><span class="v">193a43cf-96c0-4fd9-9119-fa31b3e46359</span></div>
      <div><span class="k">retained: </span><span class="v">193a43cf, c026084e</span></div>
      <div><span class="k">approvals: </span><span class="v">193a43cf → approval:pwsh</span></div>
      <div><span class="k">hooks: </span><span class="v">sessions ok / status ok</span></div>
    </div>
    <div class="callout">↑ 预计出现在这里（左上角，等宽字体小方块）</div>
  </div>
</body>
</html>
